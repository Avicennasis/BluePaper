name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # PINNED DELIBERATELY — GitHub derives an unnamed matrix job's title from
    # ALL matrix keys, so adding build-mode below would rename this job and
    # make any required "Analyze (actions)" context unsatisfiable.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Kotlin Multiplatform: 138 Kotlin files against 1 Python file, so
        # java-kotlin is the coverage that actually matters in this repo.
        language: [actions, python, java-kotlin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          # java-kotlin is MANUAL, not autobuild. Autobuild runs
          # `./gradlew assemble`, which reaches :androidApp:checkDebugAarMetadata
          # and fails on a pre-existing dependency/compileSdk mismatch
          # (androidx.core:core:1.19.0 wants compileSdk 37+, :androidApp is on
          # 36) — unrelated to code scanning. The compile tasks below mirror
          # this repo's own CI (.github/workflows/test.yml), which is green:
          # they compile every Kotlin source set without invoking Android
          # packaging. `none` is not an option here — on a compiled language it
          # yields an EMPTY database rather than an error.
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      - name: Build Kotlin (manual build-mode)
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew :shared:compileKotlinDesktop :desktopApp:compileKotlinDesktop \
                    :shared:compileDebugKotlinAndroid :androidApp:compileDebugKotlinAndroid

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
