name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run shared tests (desktop target)
        run: ./gradlew :shared:desktopTest

      - name: Compile desktop
        run: ./gradlew :shared:compileKotlinDesktop :desktopApp:compileKotlinDesktop

      - name: Compile Android
        run: ./gradlew :shared:compileDebugKotlinAndroid :androidApp:compileDebugKotlinAndroid

      # Compiling is not building. Every step above stops at Kotlin
      # compilation, so nothing here ever ran Android PACKAGING — and
      # packaging is where checkDebugAarMetadata lives. That is how the
      # androidx.core 1.19.0 bump in 62e2db5 left `assemble` broken for weeks
      # (it requires compileSdk 37, the app was on 36) while this workflow
      # stayed green. Found only because CodeQL's autobuild runs `assemble`
      # and this job does not.
      #
      # assembleDebug, not assemble: the release variant needs signing
      # config that CI has no business holding.
      - name: Assemble Android (debug)
        run: ./gradlew :androidApp:assembleDebug
